<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="920" height="600" fill="#f6f5f1"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1f2328">복장 점검 사진, 이렇게 찍어야 6개 항목이 다 보여</text>

  <!-- ===== 왼쪽: 나쁜 예 ===== -->
  <text x="40" y="84" font-size="17" font-weight="700" fill="#b3261e">✕ 상반신 셀카</text>
  <rect x="40" y="98" width="300" height="400" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="3"/>
  <clipPath id="c1"><rect x="40" y="98" width="300" height="400" rx="10"/></clipPath>
  <g clip-path="url(#c1)">
    <!-- 크게 확대된 상반신 -->
    <path d="M60 498 Q70 370 150 350 L230 350 Q310 370 320 498 Z" fill="#9aa7b4"/>
    <rect x="172" y="300" width="36" height="60" fill="#e8c4a0"/>
    <circle cx="190" cy="240" r="78" fill="#e8c4a0"/>
    <path d="M112 232 Q118 150 190 150 Q262 150 268 232 Q240 190 190 192 Q140 190 112 232 Z" fill="#2b2b2b"/>
    <!-- 보안경 -->
    <rect x="132" y="226" width="116" height="34" rx="12" fill="#bfe3f5" fill-opacity="0.75" stroke="#1f6f99" stroke-width="4"/>
    <line x1="190" y1="226" x2="190" y2="260" stroke="#1f6f99" stroke-width="3"/>
    <path d="M168 288 Q190 302 212 288" fill="none" stroke="#8a5a3c" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="40" y="526" font-size="15" fill="#1f2328">✅ 보안경, 머리카락은 보임</text>
  <text x="40" y="550" font-size="15" fill="#1f2328">❓ 장갑, 장신구, 신발은 안 보여서 판단 못 함</text>
  <text x="40" y="574" font-size="15" fill="#1f2328">❓ 소매도 끝부분이 잘려서 불확실</text>

  <!-- ===== 오른쪽: 좋은 예 ===== -->
  <text x="420" y="84" font-size="17" font-weight="700" fill="#1a7f37">◯ 전신 + 양손을 앞으로</text>
  <rect x="420" y="98" width="300" height="400" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/>
  <!-- 바닥 -->
  <line x1="440" y1="478" x2="700" y2="478" stroke="#d0d0cc" stroke-width="2"/>
  <!-- 다리 -->
  <rect x="546" y="318" width="22" height="140" fill="#3d4a5c"/>
  <rect x="574" y="318" width="22" height="140" fill="#3d4a5c"/>
  <!-- 신발 -->
  <rect x="534" y="456" width="36" height="20" rx="6" fill="#5b3a1e"/>
  <rect x="572" y="456" width="36" height="20" rx="6" fill="#5b3a1e"/>
  <!-- 몸통 -->
  <rect x="538" y="196" width="66" height="128" rx="10" fill="#9aa7b4"/>
  <!-- 팔: 앞으로 벌려 내민 모양 -->
  <path d="M542 206 L500 262 L488 304" fill="none" stroke="#9aa7b4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 206 L642 262 L654 304" fill="none" stroke="#9aa7b4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 손 -->
  <circle cx="486" cy="318" r="12" fill="#e8c4a0"/>
  <circle cx="656" cy="318" r="12" fill="#e8c4a0"/>
  <!-- 목, 머리 -->
  <rect x="563" y="178" width="16" height="22" fill="#e8c4a0"/>
  <circle cx="571" cy="152" r="30" fill="#e8c4a0"/>
  <path d="M541 150 Q543 118 571 118 Q599 118 601 150 Q590 134 571 135 Q552 134 541 150 Z" fill="#2b2b2b"/>
  <rect x="549" y="146" width="44" height="14" rx="5" fill="#bfe3f5" fill-opacity="0.8" stroke="#1f6f99" stroke-width="2.5"/>

  <!-- 번호 표시 -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="626" cy="153" r="11" fill="#1a7f37"/><text x="626" y="158">1</text>
    <circle cx="571" cy="106" r="11" fill="#1a7f37"/><text x="571" y="111">2</text>
    <circle cx="676" cy="268" r="11" fill="#1a7f37"/><text x="676" y="273">3</text>
    <circle cx="688" cy="322" r="11" fill="#1a7f37"/><text x="688" y="327">4</text>
    <circle cx="456" cy="322" r="11" fill="#1a7f37"/><text x="456" y="327">5</text>
    <circle cx="634" cy="466" r="11" fill="#1a7f37"/><text x="634" y="471">6</text>
  </g>
  <g stroke="#1a7f37" stroke-width="1.5">
    <line x1="615" y1="153" x2="594" y2="153"/>
    <line x1="667" y1="272" x2="652" y2="278"/>
    <line x1="677" y1="321" x2="669" y2="319"/>
    <line x1="467" y1="321" x2="474" y2="319"/>
    <line x1="623" y1="466" x2="609" y2="466"/>
  </g>

  <!-- 범례 -->
  <g font-size="15" fill="#1f2328">
    <text x="744" y="130" font-weight="700">보이는 항목</text>
    <text x="744" y="162">1 보안경</text>
    <text x="744" y="190">2 머리카락</text>
    <text x="744" y="218">3 소매, 옷자락</text>
    <text x="744" y="246">4 장갑 (손)</text>
    <text x="744" y="274">5 장신구 (손목)</text>
    <text x="744" y="302">6 신발</text>
  </g>

  <text x="420" y="526" font-size="15" fill="#1f2328">· 머리부터 신발까지 한 화면에 (2~3m 떨어져서)</text>
  <text x="420" y="550" font-size="15" fill="#1f2328">· 양손을 벌려 앞으로, 정면을 보고</text>
  <text x="420" y="574" font-size="15" fill="#1f2328">· 밝은 곳에서 (투명 보안경은 어두우면 안 보임)</text>
</svg>
