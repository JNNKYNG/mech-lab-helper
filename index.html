<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기계공학 실습 도우미</title>
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="manifest" href="manifest.json?v=3">
<link rel="preconnect" href="https://mjc-mech-lab.streamlit.app">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="실습 도우미">
<meta name="theme-color" content="#F2F4F8">
<style>
  html, body { margin: 0; height: 100%; background: #F2F4F8; }
  iframe { border: 0; width: 100%; height: 100vh; height: 100dvh; display: block; }
  #cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 16px; background: #F2F4F8; color: #161A22; transition: opacity .3s;
           font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  #cover img { width: 88px; height: 88px; border-radius: 20px; border: 1px solid #DDE2EA; background: #fff; }
  #cover p { margin: 0; font-size: 15px; color: #5F6878; }
  #cover .bar { width: 120px; height: 3px; border-radius: 2px; background: #DDE2EA; overflow: hidden; }
  #cover .bar i { display: block; width: 40%; height: 100%; background: #2F6BD0; border-radius: 2px; animation: go 1.1s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #cover.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<!-- 우리 아이콘과 이름을 가진 입구 페이지. 실제 앱은 아래 틀 안에서 열린다. -->
<iframe id="app" title="기계공학 실습 도우미" allow="camera; microphone; clipboard-write"></iframe>
<div id="cover">
  <img src="icon-180.png?v=3" alt="">
  <p id="msg">불러오는 중…</p>
  <div class="bar"><i></i></div>
</div>
<script>
  // 초대 링크(?c=MJ-1234)로 들어오면 그 값을 앱에 그대로 넘긴다.
  var extra = location.search ? "&" + location.search.slice(1) : "";
  var BASE = "https://mjc-mech-lab.streamlit.app";
  var app = document.getElementById("app");
  var cover = document.getElementById("cover");
  var msg = document.getElementById("msg");
  var loaded = false;

  // 앱 주소는 한 번만 넣는다 (예전에는 두 번 불러와서 느렸음).
  // 앱 화면이 준비될 때까지 우리 로고 화면을 보여 준다.
  app.addEventListener("load", function () {
    loaded = true;
    setTimeout(function () { cover.classList.add("hide"); }, 2500);
  });
  app.src = BASE + "/?embed=true" + extra;

  // 오래 걸리면 (서버가 잠들어 있는 경우) 안내만 바꾼다.
  setTimeout(function () {
    if (!loaded) msg.textContent = "서버를 깨우는 중이에요… 30초쯤 걸릴 수 있어요";
  }, 8000);
</script>
</body>
</html>
