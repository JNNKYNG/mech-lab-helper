# 스트림릿 무료 서버는 한동안 아무도 안 들어오면 잠들어서, 다음 사람이 열 때 오래 걸린다.
# 몇 시간마다 한 번씩 앱을 열어서 깨어 있게 한다. (잠들어 있으면 깨우기 버튼도 눌러 준다)
name: keep-alive

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: open app
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          INNER = "https://mjc-mech-lab.streamlit.app/~/+/?embed=true"
          with sync_playwright() as p:
              b = p.chromium.launch()
              # 1) 처음 오는 사람처럼 (쿠키 없이) 앱 본체를 바로 열어 본다
              ctx = b.new_context()
              pg = ctx.new_page()
              pg.goto(INNER, timeout=120000)
              pg.wait_for_timeout(25000)
              print("FRESH:", pg.inner_text("body")[:300].replace("\n", " | "))
              print("FRESH cookies:", [c["name"] for c in ctx.cookies()])
              # 2) 바깥 화면으로 열어서 깨운다
              pg.goto("https://mjc-mech-lab.streamlit.app/", timeout=120000)
              pg.wait_for_timeout(15000)
              wake = pg.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  print("app was asleep, waking up")
                  wake.first.click()
                  pg.wait_for_timeout(90000)
              print("SHELL cookies:", [c["name"] for c in ctx.cookies()])
              # 3) 다시 본체
              pg.goto(INNER, timeout=120000)
              pg.wait_for_timeout(20000)
              print("AFTER:", pg.inner_text("body")[:300].replace("\n", " | "))
              b.close()
          PY
